import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageJson = new JsonSlurper().parseText(file('../package.json').text)

group = 'com.hzblj.expowaveform'
version = packageJson.version

android {
  namespace "com.hzblj.expowaveform"
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // PlatformColor's resource paths (ColorPropConverter) and cancelling a JS touch when a drag starts (NativeGestureUtil).
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
